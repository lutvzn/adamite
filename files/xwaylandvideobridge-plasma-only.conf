# Only autostart Xwayland Video Bridge in Plasma. Its autostart entry has no
# OnlyShowIn=KDE, so niri and Hyprland start it too, where its hidden window gets
# tiled and takes up half the screen. This is the check systemd runs for
# OnlyShowIn=KDE: in other sessions the unit is skipped, not failed.
[Service]
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition KDE ""
